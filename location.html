<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Guide</title>
    <link rel="stylesheet" href="css/style4.css">
    <!-- FontAwesome for Navigation Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Main Scrollable Content -->
        <div class="content-area">
            <!-- Main Header Slideshow -->
            <header class="header-section">
                <div class="slideshow-wrapper">
                    <div class="slideshow-track">
                        <img src="image/sabby.jpeg" class="slide" alt="Kolej Tun Sabariah">
                        <img src="image/merah.jpeg" class="slide" alt="Kolej Tun Merah">
                        <img src="image/kudu.jpeg" class="slide" alt="Kolej Tun Kudu">
                    </div>
                </div>
            </header>

            <!-- Page Title -->
            <h1 class="page-title">LOCATION</h1>

            <!-- Location Cards Grid -->
            <main class="cards-grid">
                <!-- Card 1 -->
                <article class="location-card">
                    <div class="card-content">
                        <h2>Kolej Tun Sabariah</h2>
                        <div class="contact-block">
                            <p class="contact-title">Contact</p>
                            <p>Balqis<br><a href="tel:01165092070" class="phone">• 011-6509-2070</a></p>
                            <p>Nurul Izzah<br><a href="tel:01165642996" class="phone">• 011-6564-2996</a></p>
                        </div>
                    </div>
                    <div class="card-thumbnail">
                        <img src="image/sabby.jpeg" alt="Kolej Tun Sabariah Building">
                    </div>
                </article>

                <!-- Card 2 -->
                <article class="location-card">
                    <div class="card-content">
                        <h2>Kolej Tun Merah</h2>
                        <div class="contact-block">
                            <p class="contact-title">Contact</p>
                            <p>Farisha<br><a href="tel:0123956252" class="phone">• 012-395-6252</a></p>
                            <p>Jasmin<br><a href="tel:0183584012" class="phone">• 018-358-4012</a></p>
                        </div>
                    </div>
                    <div class="card-thumbnail">
                        <img src="image/merah.jpeg" alt="Kolej Tun Merah Building">
                    </div>
                </article>

                <!-- Card 3 -->
                <article class="location-card">
                    <div class="card-content">
                        <h2>Kolej Tun Kudu</h2>
                        <div class="contact-block">
                            <p class="contact-title">Contact</p>
                            <p>Nazmie<br><a href="tel:01117574930" class="phone">• 011-1757-4930</a></p>
                        </div>
                    </div>
                    <div class="card-thumbnail">
                        <img src="image/kudu.jpeg" alt="Kolej Tun Kudu Building">
                    </div>
                </article>
            </main>
        </div>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <img src="image/logo.png" alt="Hirup & Ngap Logo" class="nav-logo">
            
            <div class="nav-links">
                <!-- Menu Icon -->
                <a href="menu.html" class="nav-btn">
                    <div class="icon-wrapper">
                        <svg viewBox="0 0 24 24" class="nav-svg">
                            <rect x="3.5" y="3.5" width="7" height="7" rx="1.2"></rect>
                            <rect x="13.5" y="3.5" width="7" height="7" rx="1.2"></rect>
                            <rect x="3.5" y="13.5" width="7" height="7" rx="1.2"></rect>
                            <rect x="13.5" y="13.5" width="7" height="7" rx="1.2"></rect>
                        </svg>
                    </div>
                    <span>Menu</span>
                </a>

                <!-- Home Icon -->
                <a href="about us.html" class="nav-btn">
                    <div class="icon-wrapper">
                        <svg viewBox="0 0 24 24" class="nav-svg">
                            <path d="M3 10.5L12 3L21 10.5"></path>
                            <path d="M5.5 8.5V19.5H18.5V8.5"></path>
                            <path d="M9.5 19.5V13.5H14.5V19.5"></path>
                        </svg>
                    </div>
                    <span>Home</span>
                </a>

                <!-- Location Icon -->
                <a href="location.html" class="nav-btn active">
                    <div class="icon-wrapper">
                        <svg viewBox="0 0 24 24" class="nav-svg">
                            <path d="M12 21.5C12 21.5 18.5 14.8 18.5 9.5C18.5 5.91 15.59 3 12 3C8.41 3 5.5 5.91 5.5 9.5C5.5 14.8 12 21.5 12 21.5Z"></path>
                            <circle cx="12" cy="9.5" r="2.6"></circle>
                        </svg>
                    </div>
                    <span>Location</span>
                </a>
            </div>
        </nav>
    </div>
    
    <script src="js/script.js"></script>
</body>
</html>
