<body>

            <path d="M12 6C46 26 46 74 12 94" stroke="#F4ECE4" stroke-width="2.2" stroke-linecap="round" />

          <img

          <img

        <div class="hero-content">

        </div>
      </section>

      <!-- Bahagian Tengah: Carousel Auto 12 Gambar dengan Kotak Burgundy Bergerak Bersama -->

        <button type="button" class="carousel-arrow next" id="nextBtn" aria-label="Gambar Seterusnya">
          &#10095;
        </button>

        <div class="carousel-viewport" id="carouselViewport">
          <div class="carousel-track" id="carouselTrack">
            <article class="menu-card">
              <img src="img home/photo_6336793829855400684_y.jpg" alt="Gambar Menu 1" />
            </article>
            <article class="menu-card">
              <img src="img home/photo_6336793829855400685_y.jpg" alt="Gambar Menu 2" />
            </article>
            <article class="menu-card">
              <img src="img home/photo_6336793829855400686_y.jpg" alt="Gambar Menu 3" />
            </article>
            <article class="menu-card">
              <img src="img home/photo_6336793829855400687_y.jpg" alt="Gambar Menu 4" />
            </article>
            <article class="menu-card">
              <img src="img home/photo_6336793829855400688_y.jpg" alt="Gambar Menu 5" />
            </article>
            <article class="menu-card">
              <img src="img home/photo_6336793829855400689_y.jpg" alt="Gambar Menu 6" />
            </article>
            <article class="menu-card">
              <img src="img home/photo_6336793829855400690_y.jpg" alt="Gambar Menu 7" />
            </article>
            <article class="menu-card">
              <img src="img home/photo_6336793829855400691_y.jpg" alt="Gambar Menu 8" />
            </article>
            <article class="menu-card">
              <img src="img home/1.jpeg" alt="Gerai Hirup &amp; Ngap" />
            </article>
            <article class="menu-card">
              <img src="img home/2.jpeg" alt="Pelanggan Hirup Peach Tea Sparkling" />
            </article>
            <article class="menu-card">
              <img src="img home/3.jpeg" alt="Pelanggan Hirup Berry Sparkling" />
            </article>
            <article class="menu-card">
              <img src="img home/4.jpeg" alt="Selfie dengan Hirup Berry Sparkling" />
            </article>
          </div>
        </div>

        <div class="carousel-dots" id="carouselDots" aria-label="Penunjuk Slide"></div>

    </main>

    <!-- Bottom Navigation -->
	<a href="index.html" class="nav-btn">
    <nav class="bottom-nav">
      <img src="image/logo.png" alt="Hirup & Ngap Logo" class="nav-logo">
		</a>
      
      <div class="nav-links">
        <!-- Menu Icon -->
        <a href="menu.html" class="nav-btn">
          <div class="icon-wrapper">
            <svg viewBox="0 0 24 24" class="nav-svg">
              <rect x="3.5" y="3.5" width="7" height="7" rx="1.2"></rect>
              <rect x="13.5" y="3.5" width="7" height="7" rx="1.2"></rect>
              <rect x="3.5" y="13.5" width="7" height="7" rx="1.2"></rect>
              <rect x="13.5" y="13.5" width="7" height="7" rx="1.2"></rect>
            </svg>
          </div>
          <span>Menu</span>
        </a>

        <!-- Home Icon -->
        <a href="about us.html" class="nav-btn">
          <div class="icon-wrapper">
            <svg viewBox="0 0 24 24" class="nav-svg">
              <path d="M3 10.5L12 3L21 10.5"></path>
              <path d="M5.5 8.5V19.5H18.5V8.5"></path>
              <path d="M9.5 19.5V13.5H14.5V19.5"></path>
            </svg>
          </div>
          <span>Home</span>
        </a>

        <!-- Location Icon -->
        <a href="location.html" class="nav-btn active">
          <div class="icon-wrapper">
            <svg viewBox="0 0 24 24" class="nav-svg">
              <path d="M12 21.5C12 21.5 18.5 14.8 18.5 9.5C18.5 5.91 15.59 3 12 3C8.41 3 5.5 5.91 5.5 9.5C5.5 14.8 12 21.5 12 21.5Z"></path>
              <circle cx="12" cy="9.5" r="2.6"></circle>
            </svg>
          </div>
          <span>Location</span>
        </a>
      </div>
    </nav>
  </div>

  <script>
    const track = document.getElementById('carouselTrack');
    const viewport = document.getElementById('carouselViewport');
    const dotsContainer = document.getElementById('carouselDots');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    const originalCards = Array.from(track.children);
    const totalSlides = originalCards.length;

    originalCards.forEach((card) => {
      const clone = card.cloneNode(true);
      clone.setAttribute('aria-hidden', 'true');
      track.appendChild(clone);
    });

    for (let i = 0; i < totalSlides; i++) {
      const dot = document.createElement('button');
      dot.type = 'button';
      dot.className = 'dot' + (i === 0 ? ' active' : '');
      dot.setAttribute('aria-label', `Gambar ${i + 1}`);
      dot.addEventListener('click', () => {
        scrollPos = i * getStepWidth();
      });
      dotsContainer.appendChild(dot);
    }

    const dots = Array.from(dotsContainer.children);
    let scrollPos = 0;
    let isPaused = false;
    const autoSpeed = 1.1;

    function getStepWidth() {
      const firstCard = track.querySelector('.menu-card');
      const gap = parseFloat(getComputedStyle(track).gap) || 0;
      return firstCard.getBoundingClientRect().width + gap;
    }

    function autoAnimate() {
      const stepWidth = getStepWidth();
      const loopWidth = stepWidth * totalSlides;

      if (!isPaused && loopWidth > 0) {
        scrollPos += autoSpeed;
        if (scrollPos >= loopWidth) {
          scrollPos -= loopWidth;
        }
      }

      track.style.transform = `translate3d(-${scrollPos}px, 0, 0)`;

      const activeIndex = Math.round(scrollPos / stepWidth) % totalSlides;
      dots.forEach((d, i) => d.classList.toggle('active', i === activeIndex));

      requestAnimationFrame(autoAnimate);
    }

    requestAnimationFrame(autoAnimate);

    nextBtn.addEventListener('click', () => {
      const stepWidth = getStepWidth();
      const loopWidth = stepWidth * totalSlides;
      scrollPos = (scrollPos + stepWidth) % loopWidth;
    });

    prevBtn.addEventListener('click', () => {
      const stepWidth = getStepWidth();
      const loopWidth = stepWidth * totalSlides;
      scrollPos = (scrollPos - stepWidth + loopWidth) % loopWidth;
    });

    viewport.addEventListener('mouseenter', () => {
      isPaused = true;
    });
    viewport.addEventListener('mouseleave', () => {
      isPaused = false;
    });

    let touchStartX = 0;
    viewport.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      isPaused = true;
    }, { passive: true });

    viewport.addEventListener('touchend', (e) => {
      const diff = touchStartX - e.changedTouches[0].clientX;
      const stepWidth = getStepWidth();
      const loopWidth = stepWidth * totalSlides;
      if (Math.abs(diff) > 30) {
        scrollPos = diff > 0
          ? (scrollPos + stepWidth) % loopWidth
          : (scrollPos - stepWidth + loopWidth) % loopWidth;
      }
      isPaused = false;
    });

    const navButtons = document.querySelectorAll('.nav-btn');
    navButtons.forEach((btn) => {
      btn.addEventListener('click', () => {
        navButtons.forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });
  </script>
</body>
</html>
